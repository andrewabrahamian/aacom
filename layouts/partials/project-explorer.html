{{ $projects := .Site.Data.projects }}
{{ if not $projects }}
  {{ $projects = .Site.Params.Tiles.showcase }}
{{ end }}
{{ $profile := .Site.Data.profile }}
{{ if gt (len $projects) 0 }}
<section id="project-explorer" class="site-demo-section" aria-labelledby="project-explorer-heading">
  <div class="inner">
    <div id="project-explorer-root" data-static-target="project-tiles-static"></div>
    <script id="project-data" type="application/json">{{ $projects | jsonify | safeHTML }}</script>
    <script id="profile-data" type="application/json">{{ $profile | jsonify | safeHTML }}</script>
  </div>
</section>
{{ end }}
